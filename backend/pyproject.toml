[build-system]
requires = ["setuptools>=75.0"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "lexscript"
version = "0.2.0"
description = "本地私有化法律 AI 文书生成平台 - Local-first legal AI document generation SaaS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Private" }
authors = [
    { name = "Sushikai" },
]
keywords = ["legal", "ai", "document-generation", "fastapi", "llm"]

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.20",
    "sse-starlette>=2.0.0",
    "tiktoken>=0.8.0",
    "sqlite-utils>=3.38",
    "PyMuPDF>=1.25.0",
    "python-docx>=1.1.0",
    "openpyxl>=3.1.0",
    "pytesseract>=0.3.13",
    "Pillow>=11.0.0",
    "markdown>=3.7",
    "beautifulsoup4>=4.12.0",
    "chromadb>=0.5.0",
    "rank-bm25>=0.2.0",
    "numpy>=1.26.0",
    "cryptography>=44.0.0",
    "bcrypt>=5.0.0",
    "PyJWT>=2.13.0",
    "loguru>=0.7.0",
    "reportlab>=4.2.0",
    "fpdf2>=2.7.0",
    "Jinja2>=3.1.0",
    "APScheduler>=3.11.0",
    "python-dotenv>=1.2.0",
    "orjson>=3.10.0",
    "rich>=13.0.0",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-httpx>=0.35.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.7.0",
    "mypy>=1.12.0",
    "pre-commit>=3.5.0",
]
prod = [
    "gunicorn>=22.0.0",
]

[tool.setuptools.packages.find]
include = ["app*"]
where = ["."]

[tool.setuptools.package-data]
app = ["web/static/**/*", "db/migrations/*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests that need external services",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/*.py" = ["S101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false

[project.scripts]
lexscript = "app.main:main"
